name: Build SR Global VPN
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Retrieve upstream Android client
        env:
          UPSTREAM_REF: ${{ vars.OPENGATE_REF || 'master' }}
        run: |
          git init engine-project
          git -C engine-project remote add origin https://github.com/IyedAmiri/OpenGateVPN.git
          git -C engine-project fetch --depth=1 origin "$UPSTREAM_REF"
          git -C engine-project checkout --detach FETCH_HEAD
          git -C engine-project submodule update --init --recursive
          git -C engine-project rev-parse HEAD | tee upstream-commit.txt
      - name: Apply branded sources
        run: |
          python3 scripts/prepare.py engine-project
          chmod +x engine-project/gradlew
          test -f engine-project/gradle/wrapper/gradle-wrapper.jar
      - name: Install SDK
        run: sdkmanager 'platforms;android-37' 'platform-tools'
      - name: Compile APK
        working-directory: engine-project
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          mkdir -p output
          APK=$(find engine-project/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          cp "$APK" output/SR_Global_VPN.apk
          cp upstream-commit.txt output/
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$TOOLS/apksigner" verify --verbose output/SR_Global_VPN.apk
          "$TOOLS/aapt" dump badging output/SR_Global_VPN.apk | tee output/apk-info.txt
          grep -q "package: name='com.srcreationfarm.globalvpn'" output/apk-info.txt
          unzip -l output/SR_Global_VPN.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/.*openvpn'
      - name: Package assembled source
        run: tar --exclude=.git --exclude=.gradle --exclude=build --exclude=local.properties -czf output/SR_Global_VPN_source.tar.gz -C engine-project .
      - uses: actions/upload-artifact@v4
        with:
          name: SR_Global_VPN
          path: output/
          if-no-files-found: error
