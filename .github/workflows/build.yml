      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK (explicit packages, no legacy tools)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-37.0 build-tools;36.0.0'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verify SDK installation
        run: |
          set -euo pipefail
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Retrieve upstream Android client
        env:
          UPSTREAM_REF: ${{ vars.OPENGATE_REF || 'master' }}
        run: |
          set -euo pipefail
          ENGINE="$RUNNER_TEMP/sr-engine-project"
          git init "$ENGINE"
          git -C "$ENGINE" remote add origin https://github.com/IyedAmiri/OpenGateVPN.git
          git -C "$ENGINE" fetch --depth=1 origin "$UPSTREAM_REF"
          git -C "$ENGINE" checkout --detach FETCH_HEAD
          git -C "$ENGINE" submodule update --init --recursive
          git -C "$ENGINE" rev-parse HEAD | tee "$RUNNER_TEMP/sr-upstream-commit.txt"
          echo "SR_ENGINE=$ENGINE" >> "$GITHUB_ENV"
      - name: Apply branded sources
        run: |
          set -euo pipefail
          python3 "$SR_KIT/scripts/prepare.py" "$SR_ENGINE"
          chmod +x "$SR_ENGINE/gradlew"
          test -s "$SR_ENGINE/gradle/wrapper/gradle-wrapper.jar"
      - name: Check Gradle version and compile APK
        run: |
          set -euo pipefail
          cd "$SR_ENGINE"
          ./gradlew --version
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sr-vpn-output"
          mkdir -p "$OUT"
          APK="$SR_ENGINE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "$OUT/SR_Global_VPN.apk"
          cp "$RUNNER_TEMP/sr-upstream-commit.txt" "$OUT/upstream-commit.txt"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose "$OUT/SR_Global_VPN.apk"
          "$TOOLS/aapt" dump badging "$OUT/SR_Global_VPN.apk" | tee "$OUT/apk-info.txt"
          grep -q "package: name='com.srcreationfarm.globalvpn'" "$OUT/apk-info.txt"
          python3 "$SR_KIT/scripts/check_apk.py" "$OUT/SR_Global_VPN.apk"
          echo "SR_OUTPUT=$OUT" >> "$GITHUB_ENV"
      - name: Package assembled source
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.gradle --exclude=build --exclude=local.properties -czf "$SR_OUTPUT/SR_Global_VPN_source.tar.gz" -C "$SR_ENGINE" .
          tar -tzf "$SR_OUTPUT/SR_Global_VPN_source.tar.gz" > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: SR_Global_VPN
          path: ${{ env.SR_OUTPUT }}/
          if-no-files-found: error
